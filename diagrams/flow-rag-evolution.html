<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG 的三代形态 · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · RAG evolution</p>
    <h1>RAG 的三代形态</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-rag-evolution-title flow-rag-evolution-desc">
        <title id="flow-rag-evolution-title">RAG 的三代形态</title>
        <desc id="flow-rag-evolution-desc">朴素 RAG 是一次检索后直接生成；高级 RAG 增加查询改写、混合检索与重排；Agentic RAG 把检索变成工具，由模型在循环中决定查什么、查几次。</desc>
        <defs>
          <marker id="flow-rag-evolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flow-rag-evolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="40" y1="180" x2="920" y2="180" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="40" y1="310" x2="920" y2="310" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

        <!-- row 1 connectors -->
        <line x1="320" y1="124" x2="400" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>
        <line x1="600" y1="124" x2="680" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>
        <rect x="330" y="104" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="113" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">TOP-K</text>
        <rect x="612" y="104" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="113" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">STUFF</text>

        <!-- row 2 connectors -->
        <line x1="300" y1="254" x2="380" y2="254" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>
        <line x1="620" y1="254" x2="700" y2="254" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>

        <!-- row 3 connectors -->
        <line x1="320" y1="376" x2="400" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>
        <line x1="400" y1="396" x2="320" y2="396" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#flow-rag-evolution-arrow)"/>
        <rect x="336" y="356" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="365" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">QUERY</text>
        <rect x="332" y="404" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="413" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">EVIDENCE</text>

        <path d="M 230 412 V 448 Q 230 456 238 456 H 772 Q 780 456 780 448 V 412"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-rag-evolution-arrow)"/>
        <rect x="465" y="436" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="505" y="445" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">FINAL ANSWER</text>

        <!-- row labels -->
        <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
          <text x="40" y="116" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.14em">01 / NAIVE</text>
          <text x="40" y="134" font-size="12" font-weight="600" fill="#2d3142">朴素 RAG</text>

          <text x="40" y="246" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.14em">02 / ADVANCED</text>
          <text x="40" y="264" font-size="12" font-weight="600" fill="#2d3142">高级 RAG</text>

          <text x="40" y="376" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.14em">03 / AGENTIC</text>
          <text x="40" y="394" font-size="12" font-weight="600" fill="#2d3142">Agentic RAG</text>
        </g>

        <!-- row 1 nodes -->
        <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
          <rect x="140" y="96" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="140" y="96" width="180" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="230" y="120" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Query</text>
          <text x="230" y="137" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">user question</text>

          <rect x="400" y="96" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="400" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="500" y="120" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Retrieve</text>
          <text x="500" y="137" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">top-k chunks</text>

          <rect x="680" y="96" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="780" y="120" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Generate</text>
          <text x="780" y="137" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">answer + citations</text>

          <!-- row 2 nodes -->
          <rect x="140" y="226" width="160" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="140" y="226" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="220" y="250" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Query</text>
          <text x="220" y="267" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">rewrite first</text>

          <rect x="380" y="226" width="240" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="380" y="226" width="240" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="500" y="250" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Rewrite · Hybrid · Rerank</text>
          <text x="500" y="267" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">filters · multi-hop</text>

          <rect x="700" y="226" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="700" y="226" width="180" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="790" y="250" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Generate</text>
          <text x="790" y="267" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">answer + citations</text>

          <!-- row 3 nodes -->
          <rect x="140" y="356" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="140" y="356" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="230" y="380" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Agent</text>
          <text x="230" y="397" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">decides · checks</text>

          <rect x="400" y="356" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="400" y="356" width="200" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="500" y="380" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Search Tool</text>
          <text x="500" y="397" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">query · evidence</text>

          <rect x="680" y="356" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="356" width="200" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="780" y="380" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Answer</text>
          <text x="780" y="397" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">stop when enough</text>
        </g>

        <text x="480" y="520" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75" text-anchor="middle">从固定管道，到模型自主决定的检索能力。</text>
      </svg>
    </div>
  </div>
</body>
</html>
