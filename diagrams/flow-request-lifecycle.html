<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一次真实请求的协作流程 · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1064px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Request lifecycle</p>
    <h1>一次真实请求的协作流程</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1064 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-request-lifecycle-title flow-request-lifecycle-desc">
        <title id="flow-request-lifecycle-title">一次真实请求的协作流程</title>
        <desc id="flow-request-lifecycle-desc">以修复失败测试为例，用户提出任务后，harness 注入上下文，模型匹配 skill、规划并调用工具或子代理，harness 执行硬约束与审批，模型循环修复，最后做回归判定并写入记忆。</desc>
        <defs>
          <marker id="flow-request-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flow-request-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- lane tints and dividers -->
        <rect x="140" y="36" width="884" height="80" fill="rgba(45,49,66,0.018)"/>
        <rect x="140" y="196" width="884" height="80" fill="rgba(45,49,66,0.018)"/>
        <line x1="40" y1="36" x2="1024" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="40" y1="116" x2="1024" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="40" y1="196" x2="1024" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="40" y1="276" x2="1024" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="40" y1="356" x2="1024" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- lane labels -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.12em" text-anchor="middle">
          <text x="90" y="80">USER</text>
          <text x="90" y="160">MODEL</text>
          <text x="90" y="240">HARNESS</text>
          <text x="90" y="320">CAPABILITY</text>
        </g>

        <!-- step headers -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.12em" text-anchor="middle">
          <circle cx="198" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="198" y="19" fill="#2d3142">1</text><text x="198" y="32">ASK</text>
          <circle cx="310" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="310" y="19" fill="#2d3142">2</text><text x="310" y="32">BOOT</text>
          <circle cx="422" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="422" y="19" fill="#2d3142">3</text><text x="422" y="32">SKILL</text>
          <circle cx="534" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="534" y="19" fill="#2d3142">4</text><text x="534" y="32">PLAN</text>
          <circle cx="646" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="646" y="19" fill="#2d3142">5</text><text x="646" y="32">ACT</text>
          <circle cx="758" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="758" y="19" fill="#2d3142">6</text><text x="758" y="32">GUARD</text>
          <circle cx="870" cy="16" r="8" fill="rgba(191,69,32,0.20)"/><text x="870" y="19" fill="#bf4520">7</text><text x="870" y="32" fill="#bf4520">FIX</text>
          <circle cx="982" cy="16" r="8" fill="rgba(45,49,66,0.12)"/><text x="982" y="19" fill="#2d3142">8</text><text x="982" y="32">VERIFY</text>
        </g>

        <!-- connectors -->
        <path d="M 248 76 H 302 Q 310 76 310 84 V 204" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <path d="M 360 236 H 414 Q 422 236 422 228 V 188" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <line x1="472" y1="156" x2="484" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <path d="M 584 156 H 638 Q 646 156 646 164 V 284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <path d="M 696 316 H 750 Q 758 316 758 308 V 268" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <path d="M 808 236 H 862 Q 870 236 870 228 V 188" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#flow-request-lifecycle-arrow-accent)"/>
        <path d="M 920 156 H 974 Q 982 156 982 164 V 284" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#flow-request-lifecycle-arrow-accent)"/>

        <!-- nodes -->
        <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
          <!-- 1 user -->
          <rect x="148" y="44" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="148" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="152" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="159" y="56" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">USR</text>
          <text x="198" y="84" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">提任务</text>
          <text x="198" y="102" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">failing test</text>

          <!-- 2 harness -->
          <rect x="260" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="260" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="264" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="271" y="216" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">HAR</text>
          <text x="310" y="244" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">启动加载</text>
          <text x="310" y="262" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">AGENTS.md</text>

          <!-- 3 model -->
          <rect x="372" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="372" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="376" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="383" y="136" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">MDL</text>
          <text x="422" y="164" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">匹配 Skill</text>
          <text x="422" y="182" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">SKILL.md</text>

          <!-- 4 model -->
          <rect x="484" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="484" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="488" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="495" y="136" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">MDL</text>
          <text x="534" y="164" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">规划</text>
          <text x="534" y="182" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">decide path</text>

          <!-- 5 capability -->
          <rect x="596" y="284" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="596" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="600" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="607" y="296" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">CAP</text>
          <text x="646" y="324" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">执行能力</text>
          <text x="646" y="342" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">tool · mcp</text>

          <!-- 6 harness -->
          <rect x="708" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="708" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="712" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="719" y="216" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">HAR</text>
          <text x="758" y="244" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">硬约束</text>
          <text x="758" y="262" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">Hook · Perms</text>

          <!-- 7 model focal -->
          <rect x="820" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="820" y="124" width="100" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="824" y="128" width="14" height="10" rx="2" fill="rgba(191,69,32,0.18)"/>
          <text x="831" y="136" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#bf4520" text-anchor="middle">MDL</text>
          <text x="870" y="164" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">循环修复</text>
          <text x="870" y="182" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">test / fix</text>

          <!-- 8 capability -->
          <rect x="932" y="284" width="100" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="932" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="936" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
          <text x="943" y="296" font-family="'Geist Mono', monospace" font-size="6" font-weight="600" fill="#4f5d75" text-anchor="middle">CAP</text>
          <text x="982" y="324" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">回归与记忆</text>
          <text x="982" y="342" font-family="'Geist Mono', monospace" font-size="6.5" fill="#5a6580" text-anchor="middle">Eval · Memory</text>
        </g>

        <!-- legend -->
        <rect x="40" y="374" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="383" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em">FOCAL / AGENT LOOP</text>
        <line x1="260" y1="380" x2="292" y2="380" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-request-lifecycle-arrow)"/>
        <text x="300" y="383" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em">HANDOFF</text>
        <circle cx="420" cy="380" r="7" fill="rgba(45,49,66,0.12)"/>
        <text x="420" y="383" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142" text-anchor="middle">3</text>
        <text x="438" y="383" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.08em">STEP</text>
        <text x="1024" y="383" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" text-anchor="end">8 steps · 4 actors</text>
      </svg>
    </div>
  </div>
</body>
</html>
