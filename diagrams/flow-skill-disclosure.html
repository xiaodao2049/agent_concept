<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill 的三级渐进披露 · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Progressive disclosure</p>
    <h1>Skill 的三级渐进披露</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-skill-disclosure-title flow-skill-disclosure-desc">
        <title id="flow-skill-disclosure-title">Skill 的三级渐进披露</title>
        <desc id="flow-skill-disclosure-desc">Skill 先只注入名称与描述，命中任务后读取 SKILL.md 正文，执行时再按需读取 references 或运行 scripts；右侧显示每一级真正进入上下文的成本。</desc>
        <defs>
          <marker id="flow-skill-disclosure-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flow-skill-disclosure-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- right panel -->
        <rect x="440" y="88" width="460" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="456" y="108" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.14em">CONTEXT COST →</text>

        <rect x="460" y="118" width="96" height="20" rx="3" fill="rgba(191,69,32,0.18)" stroke="#bf4520" stroke-width="0.8"/>
        <text x="568" y="132" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">~tens of tokens × N</text>

        <rect x="460" y="218" width="272" height="20" rx="3" fill="rgba(45,49,66,0.14)"/>
        <text x="744" y="232" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">selected SKILL.md</text>

        <rect x="460" y="318" width="420" height="20" rx="3" fill="rgba(45,49,66,0.10)"/>
        <text x="460" y="310" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">references + scripts, on demand</text>

        <text x="456" y="384" font-family="'Instrument Serif', 'Noto Serif', serif" font-size="14" font-style="italic" fill="#4f5d75">Pay only for the depth the task needs.</text>

        <!-- stage connectors -->
        <line x1="210" y1="160" x2="210" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-skill-disclosure-arrow)"/>
        <line x1="210" y1="260" x2="210" y2="296" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-skill-disclosure-arrow)"/>

        <rect x="218" y="172" width="132" height="16" rx="2" fill="#f5f5f5"/>
        <text x="224" y="183" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a6580">description 命中</text>

        <rect x="218" y="272" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="224" y="283" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a6580">正文要求继续</text>

        <!-- stages -->
        <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
          <rect x="60" y="96" width="300" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="96" width="300" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="80" y="123" font-size="12" font-weight="600" fill="#2d3142">Skill catalog</text>
          <text x="80" y="141" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">name + description</text>

          <rect x="60" y="196" width="300" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="196" width="300" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="80" y="223" font-size="12" font-weight="600" fill="#2d3142">SKILL.md</text>
          <text x="80" y="241" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">instructions · constraints</text>

          <rect x="60" y="296" width="300" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="296" width="300" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="80" y="323" font-size="12" font-weight="600" fill="#2d3142">references / scripts</text>
          <text x="80" y="341" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">read or run on demand</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
