<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一次工具调用的往返 · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Tool call</p>
    <h1>一次工具调用的往返</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-tool-call-title flow-tool-call-desc">
        <title id="flow-tool-call-title">一次工具调用的往返</title>
        <desc id="flow-tool-call-desc">模型输出调用意图，harness 路由并执行工具，观察结果回到上下文，循环直到停止条件；模型本身不执行任何工具。</desc>
        <defs>
          <marker id="flow-tool-call-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="flow-tool-call-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- connectors first -->
        <line x1="280" y1="156" x2="380" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-tool-call-arrow)"/>
        <line x1="580" y1="156" x2="680" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-tool-call-arrow)"/>

        <path d="M 780 192 V 242 Q 780 250 772 250 H 528 Q 520 250 520 242 V 192"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-tool-call-arrow)"/>
        <path d="M 440 192 V 292 Q 440 300 432 300 H 188 Q 180 300 180 292 V 192"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flow-tool-call-arrow)"/>

        <!-- arrow labels with masked gaps -->
        <rect x="300" y="136" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="330" y="145" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">1 · INTENT</text>

        <rect x="600" y="136" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="630" y="145" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">2 · EXECUTE</text>

        <rect x="618" y="230" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="239" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">3 · OBSERVE</text>

        <rect x="278" y="280" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="310" y="289" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">4 · CONTEXT</text>

        <!-- nodes -->
        <g font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
          <rect x="80" y="120" width="200" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="120" width="200" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="180" y="150" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Model</text>
          <text x="180" y="170" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">intent only</text>

          <rect x="380" y="120" width="200" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="380" y="120" width="200" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="480" y="150" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Harness</text>
          <text x="480" y="170" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">route · execute · loop</text>

          <rect x="680" y="120" width="200" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="120" width="200" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="780" y="150" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">Tool</text>
          <text x="780" y="170" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580" text-anchor="middle">REST · DB · CLI</text>
        </g>

        <text x="480" y="356" font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4f5d75" text-anchor="middle">模型只输出调用意图，不执行；执行永远发生在 Harness 侧。</text>
      </svg>
    </div>
  </div>
</body>
</html>
